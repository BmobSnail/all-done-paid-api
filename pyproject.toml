[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "all-done-paid-api"
version = "0.1.0"
description = "All-Done Paid API - 独立的付费 API 服务"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["app*"]

# ============= Ruff =============
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RET", "RUF"]
ignore = ["E501"]  # 行长由 line-length 控制

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============= Mypy =============
[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["alembic/versions", ".venv"]

[[tool.mypy.overrides]]
module = "app.infra.llm.*"
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "app.core.security"
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true

# ============= Pytest =============
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --tb=short"
markers = [
    "integration: 集成测试（需 docker-compose.dev）",
    "slow: 慢测试",
]

# ============= Coverage =============
[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "*/tests/*", "alembic/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 60
