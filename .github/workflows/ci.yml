name: ci

on:
  push:
    branches: [em-develop, em-stable, main]
  pull_request:
    branches: [em-develop, em-stable, main]

jobs:
  lint-typecheck-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check app tests scripts

      - name: Ruff format check
        run: ruff format --check app tests scripts

      - name: Mypy
        run: mypy app
        continue-on-error: true  # 允许逐步收敛

      - name: Unit tests
        env:
          PAID_API_KEY_PEPPER: ci_pepper_long_enough_string_for_tests
          PAID_INTERNAL_BYPASS_ENABLED: "true"
        run: pytest tests/unit -q --maxfail=1

  integration:
    runs-on: ubuntu-latest
    needs: lint-typecheck-unit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: omniknight  # 历史遗留：PG 库名/用户名保持 omniknight（数据层不迁移，命名规范 v3.0 §4）
          POSTGRES_USER: omniknight
          POSTGRES_PASSWORD: omniknight_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U omniknight -d omniknight"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run integration tests
        env:
          PAID_API_KEY_PEPPER: ci_pepper_long_enough_string_for_tests
          PAID_INTERNAL_BYPASS_ENABLED: "true"
          PAID_DB_URL: postgresql+asyncpg://omniknight:omniknight_dev@localhost:5433/omniknight
          PAID_REDIS_URL: redis://localhost:6380/0
        run: pytest tests/integration -q -m integration

  build-image:
    runs-on: ubuntu-latest
    needs: lint-typecheck-unit
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: all-done-paid-api:ci
