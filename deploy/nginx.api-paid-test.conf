# ⚠️ 已废弃（2026-09-03）：预发域名 api-paid-test.all-done.cn 从未配置 DNS 解析。
# 生产反代已迁移到服务器 /etc/nginx/sites-available/pay.all-done.cn.conf
# （pay.all-done.cn → 127.0.0.1:8001，SSE 禁缓冲，certbot 证书至 2026-12-02）。
# 本文件仅作历史参考；SSE 反代参数已并入生产 vhost。
#
# 历史：nginx 反代 + IP 白名单：api-paid-test.all-done.cn
#
# 原部署到 /etc/nginx/conf.d/api-paid-test.all-done.cn.conf
# SSL：certbot --nginx -d api-paid-test.all-done.cn
# 白名单：通过 geo $paid_allow 控制；放开测试时把 if 块整体注释掉
# SSE 路径需关闭 buffering，避免响应被 Nginx 缓冲到结束才下发

geo $paid_allow {
    default 0;
    # 公司出口 / 测试机：上线前补
    # 1.2.3.4/32 1;
    # 5.6.7.8/32 1;
}

server {
    listen 80;
    server_name api-paid-test.all-done.cn;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api-paid-test.all-done.cn;

    ssl_certificate     /etc/letsencrypt/live/api-paid-test.all-done.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-paid-test.all-done.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 1m;
    keepalive_timeout 75s;

    if ($paid_allow = 0) {
        return 403;
    }

    # 健康检查保留给 LB
    location = /healthz { proxy_pass http://127.0.0.1:8001; }
    location = /readyz  { proxy_pass http://127.0.0.1:8001; }

    # SSE 流式：禁缓冲 + 长超时
    location /api/v1/divination/meihua/interpret {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
