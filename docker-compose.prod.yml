# Production compose for All-Done ToB 付费 API（paid + redis）— 命名规范 v3.0
# 权威版与服务器 /opt/all-done/api-paid/docker-compose.prod.yml 保持一致
name: all-done-paid

services:
  redis:
    image: redis:7-alpine
    container_name: all-done-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - all_done_net
    restart: unless-stopped

  api-paid:
    build: .
    image: ghcr.io/jiangqingfeng/all-done-api-paid:latest
    container_name: all-done-paid
    env_file: .env.prod
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - all_done_net
    restart: unless-stopped

networks:
  all_done_net:
    external: true
    name: all_done_net
